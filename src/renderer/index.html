<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Taskyard</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         img-src taskyard: = each display's wallpaper (main's taskyard://wallpaper/<id> handler). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: taskyard:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
