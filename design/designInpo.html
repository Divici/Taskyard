    <title vid="4">Flux Fences | Desktop Organizer</title>
    <style vid="5">
        :root {
            --bg-black: #000000;
            --deep-blue: #001233;
            --electric-blue: #0077ff;
            --liquid-cyan: #00f2ff;
            --glass-white: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(0, 242, 255, 0.15);
            --glow-shadow: 0 8px 32px 0 rgba(0, 119, 255, 0.2);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            
            
            --radius-organic: 24px 60px 32px 50px;
            --radius-standard: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        
        .ambient-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--electric-blue) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        .blob-1 { top: -100px; right: -100px; }
        .blob-2 { bottom: -100px; left: -100px; }

        
        nav {
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-size: 14px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--liquid-cyan), var(--electric-blue));
            border-radius: var(--radius-organic);
            box-shadow: 0 0 15px var(--electric-blue);
        }

        .nav-pills {
            display: flex;
            background: var(--glass-white);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            padding: 8px 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        
        main {
            flex: 1;
            padding: 0 40px 40px 40px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 32px;
        }

        .canvas {
            position: relative;
            background: radial-gradient(circle at center, #050505 0%, #000 100%);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
        }

        
        .fence {
            position: absolute;
            background: rgba(0, 15, 40, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-standard);
            padding: 16px;
            min-width: 280px;
            box-shadow: var(--glow-shadow);
            cursor: move;
            transition: border-color 0.3s ease;
        }

        .fence:hover {
            border-color: var(--liquid-cyan);
        }

        .fence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .fence-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--liquid-cyan);
            font-weight: 700;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .icon-glyph {
            width: 40px;
            height: 40px;
            background: var(--glass-white);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .desktop-icon:hover .icon-glyph {
            transform: scale(1.05);
            background: rgba(255,255,255,0.1);
            border-color: var(--electric-blue);
        }

        .icon-label {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            text-align: center;
            max-width: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        
        .inspector {
            background: var(--glass-white);
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--liquid-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--liquid-cyan);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--liquid-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--liquid-cyan);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .toggle-switch {
            width: 32px;
            height: 18px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.on {
            background: var(--electric-blue);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle-switch.on::after {
            transform: translateX(14px);
        }

        
        .color-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .dot.active { border-color: white; }
        .dot.blue { background: var(--electric-blue); }
        .dot.cyan { background: var(--liquid-cyan); }
        .dot.purple { background: #8e2de2; }
        .dot.white { background: #fff; }

        
        .btn-primary {
            margin-top: auto;
            background: linear-gradient(90deg, var(--electric-blue), var(--liquid-cyan));
            border: none;
            color: black;
            font-weight: 700;
            font-size: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

    </style>

    <script vid="102">
        
        document.querySelectorAll('.toggle-switch').forEach(toggle => {
            toggle.onclick = () => toggle.classList.toggle('on');
        });

        document.querySelectorAll('.dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelector('.dot.active').classList.remove('active');
                dot.classList.add('active');
            };
        });

        
        const fences = document.querySelectorAll('.fence');
        fences.forEach(fence => {
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            fence.addEventListener('mousedown', (e) => {
                isDragging = true;
                offset.x = e.clientX - fence.getBoundingClientRect().left;
                offset.y = e.clientY - fence.getBoundingClientRect().top;
                fence.style.zIndex = 1000;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const canvas = document.getElementById('dropzone').getBoundingClientRect();
                let x = e.clientX - canvas.left - offset.x;
                let y = e.clientY - canvas.top - offset.y;
                
                
                x = Math.max(0, Math.min(x, canvas.width - fence.offsetWidth));
                y = Math.max(0, Math.min(y, canvas.height - fence.offsetHeight));

                fence.style.left = x + 'px';
                fence.style.top = y + 'px';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                fence.style.zIndex = 1;
            });
        });
    </script>
